          "422": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            },
            "description": "Validation Error"
          }
        },
        "security": [
          {
            "BearerApiKey": []
          },
          {
            "ApiKeyAuth": []
          }
        ],
        "summary": "Run Social Profile Analysis",
        "tags": [
          "social-profile-analysis"
        ]
      }
    },
