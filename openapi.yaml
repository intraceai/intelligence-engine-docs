  "info": {
    "description": "API-first OSINT service for customer intelligence workflows.\n\nAuthentication: send the provisioned API key as `X-API-Key: <key>` or `Authorization: Bearer <key>`.\n\nAll capability responses return normalized, deduplicated, connector-agnostic outputs. Provider provenance\nand connector-specific identifiers are intentionally excluded from public result payloads. Raw source URLs are\nexcluded except for web/adverse-media hits, where `resultUrl` intentionally exposes the full page URL.\n\nEach capability supports inline execution, async job lookup, and server-sent event streaming.",
    "summary": "Deployable API-first intelligence service for web search, PII expansion, and social profile matching.",
    "title": "intelligence-api",
    "version": "0.1.0"
  },
